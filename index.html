<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TulenmasCandy Box</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial, sans-serif;
  user-select:none;
  overflow:hidden;
}

#top{
  text-align:center;
  font-size:26px;
  padding:10px;
}

#hearts{
  position:fixed;
  left:10px;
  top:80px;
  font-size:26px;
}

#box{
  position:relative;
  margin:70px auto 0;
  width:90vw;
  max-width:400px;
  height:55vh;
  border:4px solid #fff;
  border-radius:20px;
  overflow:hidden;
  background:#1a1a1a;
}

.candy{
  position:absolute;
  width:26px;
  pointer-events:none;
}

#counter{
  text-align:center;
  margin-top:10px;
  font-size:18px;
}

#stopBtn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
  background:red;
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:10;
}

.box{
  font-size:20px;
  padding:20px;
}

button{
  margin-top:20px;
  padding:12px 20px;
  font-size:16px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- ЗАГРУЗКА -->
<div class="overlay" id="loading">
  <div class="box">
    <h2>Загрузка TulenmasCandy… 🍬</h2>
  </div>
</div>

<div id="top">🕐 🕐 🕐</div>
<div id="hearts"></div>

<div id="box"></div>

<div id="counter">
  <span id="current">0</span> /
  <span id="goal">0</span>
</div>

<button id="stopBtn">СТОП</button>

<!-- ОБУЧЕНИЕ -->
<div class="overlay" id="tutorial" style="display:none">
  <div class="box">
    <h2>📦 TulenmasCandy Box</h2>
    <p>
      Конфеты падают в коробку 🍬<br><br>
      Нажми <b>СТОП</b>, когда количество<br>
      будет <b>в пределах ±5</b> от цели.<br><br>
      Все сердца 💔 — блокировка навсегда.
    </p>
    <button onclick="startGame()">Понятно</button>
  </div>
</div>

<!-- ОВЕРЛЕЙ -->
<div class="overlay" id="overlay" style="display:none">
  <div class="box" id="overlayText"></div>
</div>

<script>
const candyImg = "0D1FE365-BEBC-45DE-B474-68D1B195F3AC.png";

/* 🔒 БЛОКИРОВКА */
if(localStorage.getItem("tulen_blocked")){
  document.body.innerHTML = `
    <div class="overlay">
      <div class="box">
        <h2>⛔ ДОСТУП ЗАБЛОКИРОВАН</h2>
        <p>Тюлень недоволен 🦭💔</p>
      </div>
    </div>`;
}

/* ПРЕДЗАГРУЗКА ТЕКСТУРЫ */
const preload = new Image();
preload.src = candyImg;
preload.onload = () => {
  document.getElementById("loading").style.display="none";
  document.getElementById("tutorial").style.display="flex";
};

/* НАСТРОЙКИ */
const levels = [
  {speed:700, streams:1, min:20, max:40},
  {speed:400, streams:2, min:50, max:80},
  {speed:220, streams:3, min:80, max:120}
];

let level = 0;
let hearts = 5;
let goal = 0;
let count = 0;
let running = false;
let interval;
let progress = ["🕐","🕐","🕐"];
let stackHeight = 0;

const box = document.getElementById("box");
const heartsEl = document.getElementById("hearts");
const topEl = document.getElementById("top");
const goalEl = document.getElementById("goal");
const currentEl = document.getElementById("current");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function updateUI(){
  heartsEl.textContent = "❤️".repeat(hearts);
  topEl.textContent = progress.join(" ");
  goalEl.textContent = goal;
  currentEl.textContent = count;
}

function startGame(){
  document.getElementById("tutorial").style.display="none";
  startLevel();
}

function startLevel(){
  const l = levels[level];
  goal = rand(l.min, l.max);
  count = 0;
  stackHeight = 0;
  running = true;
  box.innerHTML="";
  updateUI();

  interval = setInterval(()=>{
    for(let i=0;i<l.streams;i++) dropCandy();
  }, l.speed);
}

function dropCandy(){
  if(!running) return;

  const c = document.createElement("img");
  c.src = candyImg;
  c.className="candy";
  c.style.left = rand(5,95)+"%";
  box.appendChild(c);

  const candySize = 26;
  const targetY = box.clientHeight - candySize - stackHeight;
  stackHeight += candySize * 0.9;

  let y = -30;
  const fall = setInterval(()=>{
    y += 6;
    if(y >= targetY){
      y = targetY;
      clearInterval(fall);
    }
    c.style.top = y + "px";
  },16);

  count++;
  currentEl.textContent = count;
}

function stopGame(){
  if(!running) return;
  running=false;
  clearInterval(interval);

  if(Math.abs(count-goal)<=5){
    progress[level]="✅";
    level++;

    if(level===3){
      overlay.style.display="flex";
      overlayText.innerHTML=`
        <h2>🎉 ПОБЕДА</h2>
        <p>
          Все сложности пройдены ✅✅✅<br><br>
          Пришли скрин в группу<br>
          <b>«TulenmasCandy Hunt»</b>
        </p>`;
    }else{
      showOverlay("Сложность пройдена ✅", startLevel);
    }
  }else{
    hearts--;
    if(hearts<=0){
      localStorage.setItem("tulen_blocked","1");
      location.reload();
    }else{
      showOverlay("Ошибка 💔", startLevel);
    }
  }
}

function showOverlay(text, cb){
  overlay.style.display="flex";
  overlayText.innerHTML=`<p>${text}</p>`;
  setTimeout(()=>{
    overlay.style.display="none";
    cb();
  },1200);
}

document.getElementById("stopBtn").onclick = stopGame;
updateUI();
</script>

</body>
</html>
